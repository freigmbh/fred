include /etc/nginx/fred/proxy.conf;

location = /api/webhook/gitlab {
    proxy_pass http://backend:3211/webhook/gitlab;
}

location /api/ {
    proxy_pass http://backend:3210;
}

location = /api {
    proxy_pass http://backend:3210;
}

location = /version {
    proxy_pass http://backend:3210;
}

location = /instance_name {
    proxy_pass http://backend:3210;
}

location = /dashboard {
    return 302 $fred_dashboard_url/;
}

location = /dashboard/ {
    return 302 $fred_dashboard_url/;
}

location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
}
