server {
    listen 8080;
    server_name _;
    return 308 ${FRED_PUBLIC_URL}$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    include /etc/nginx/fred/tls.conf;
    include /etc/nginx/fred/routes.conf;
}

server {
    listen 9443 ssl;
    http2 on;
    server_name _;
    include /etc/nginx/fred/tls.conf;
    include /etc/nginx/fred/dashboard.conf;
}
